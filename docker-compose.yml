services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/portfolio
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_NAME: ${ADMIN_NAME:-Portfolio Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@portfolio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    ports:
      - "4000:4000"

volumes:
  mongo-data:
